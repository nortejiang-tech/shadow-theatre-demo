      const locked = !State.badges[5];
      d.classList.toggle('locked', locked);
      d.classList.toggle('done', State.badges[5]);
      d.textContent = State.badges[5] ? '🎓' : '';
    } else {
      d.textContent = i === State.chapter ? '' : '';
    }
  });

function awardBadge(i){
  if (State.badges[i]) return;
  State.badges[i] = true;
  saveProgress();
  refreshNav();
  const b = BADGES[i];
  const toast = $('badge-toast');
  toast.querySelector('.n').textContent = `${b.emoji} ${b.name}`;
  toast.style.borderColor = b.color;
  toast.classList.add('show');
  AudioKit.badge();
  setTimeout(() => toast.classList.remove('show'), 2800);
  // 五章全过 → 毕业典礼徽章 + 解锁沙盒
  if (i < 5 && State.badges.slice(0,5).every(Boolean) && !State.badges[5]){
    setTimeout(() => { awardBadge(5); showGraduation(); }, 3200);
  }
}

// ---- 迷你地球（朝向太阳一面的正射投影，点选站位） ----
const MiniGlobe = (() => {
  const cv = $('miniglobe'), cx = cv.getContext('2d');
  // 影斑采样缓冲：96×96 足够平滑，每帧约 9k 次 coneShade，开销可忽略
  const SH_N = 96;
  const shCv = document.createElement('canvas'); shCv.width = shCv.height = SH_N;
  const shCx = shCv.getContext('2d');
  const _mgP = new THREE.Vector3();
  let _shImg = null;
  const shadowImg = () => (_shImg || (_shImg = shCx.createImageData(SH_N, SH_N)));
  const panel = $('miniglobe-panel');
  const W = cv.width, C = W/2, R = W*0.44;

  function basis(){
    const s = sunDirW.clone();
    const right = new THREE.Vector3().crossVectors(_YAXIS, s).normalize();
    const up = new THREE.Vector3().crossVectors(s, right).normalize();
    return { s, right, up };
  }
  function project(dir, b){
    const cosr = dir.dot(b.s);
    if (cosr <= 0.02) return null;      // 背面
    return { x: C + dir.dot(b.right)*R, y: C - dir.dot(b.up)*R, cosr };
  }
  function draw(){
    const b = basis();
    cx.clearRect(0,0,W,W);
    // 地球圆盘
    const g = cx.createRadialGradient(C-R*0.3, C-R*0.35, R*0.1, C, C, R);
    g.addColorStop(0, '#3d78c4'); g.addColorStop(0.75, '#1c4f8f'); g.addColorStop(1, '#0d2a52');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(C, C, R, 0, Math.PI*2); cx.fill();
    // 经纬网格
    cx.strokeStyle = 'rgba(154,164,200,0.18)'; cx.lineWidth = 1;
    for (let k=1;k<4;k++){
      cx.beginPath(); cx.arc(C, C, R*k/4, 0, Math.PI*2); cx.stroke();
    }
    cx.beginPath(); cx.moveTo(C-R, C); cx.lineTo(C+R, C);
    cx.moveTo(C, C-R); cx.lineTo(C, C+R); cx.stroke();
    /* 影子（日食章节）：逐点把小地球上的位置反投影回地表的 3D 点，
       用与主视图、与 PIP 完全相同的 coneShade 采样。
       于是"你站在哪里"这个小圆盘上的影斑，和大画面里地球上那块影子、
       以及小朋友抬头看到的太阳缺口，说的是同一件事 —— 图钉进出影子，
       右下角的天空就跟着变。 */
    if ((State.chapter === 3 || State.chapter === 6) && earthMat.uniforms.uConeUmbraLen.value > 0){
      const u = earthMat.uniforms, Re = RE_RENDER*earthGroup.scale.x;
      const img = shadowImg(), d = img.data;
      for (let j=0;j<SH_N;j++) for (let i=0;i<SH_N;i++){
        const nx = (i/(SH_N-1))*2-1, ny = 1-(j/(SH_N-1))*2;
        const r2 = nx*nx+ny*ny, k = (j*SH_N+i)*4;
        if (r2 > 1){ d[k+3] = 0; continue; }
        _mgP.copy(b.s).multiplyScalar(Math.sqrt(1-r2))
            .addScaledVector(b.right, nx).addScaledVector(b.up, ny)
            .multiplyScalar(Re).add(earthGroup.position);
        const sh = coneShadeAt(_mgP, u.uConeBase.value, u.uConeAxis.value, u.uConeBaseR.value,
                               u.uConeUmbraLen.value, u.uConePenLen.value, u.uConePenTipR.value);
        d[k]=18; d[k+1]=12; d[k+2]=46; d[k+3] = Math.round(230*sh);
      }
      shCx.putImageData(img, 0, 0);
      cx.save();
      cx.beginPath(); cx.arc(C, C, R, 0, Math.PI*2); cx.clip();
      cx.drawImage(shCv, C-R, C-R, R*2, R*2);
      cx.restore();
    }
    // 观察者图钉
    const op = project(D.obsDir, b);
    if (op){
      cx.fillStyle = '#ffd166';
      cx.beginPath(); cx.arc(op.x, op.y, 7, 0, Math.PI*2); cx.fill();
      cx.strokeStyle = 'rgba(255,209,102,0.55)'; cx.lineWidth = 3;
      cx.beginPath(); cx.arc(op.x, op.y, 13, 0, Math.PI*2); cx.stroke();
    } else {
      $('miniglobe-hint').textContent = '你站在背面啦 —— 点一下这边，回到朝向月亮的一面';
    }
    // 边缘描边
    cx.strokeStyle = 'rgba(154,164,200,0.4)'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(C, C, R, 0, Math.PI*2); cx.stroke();
  }
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width*W, y = (e.clientY - r.top)/r.height*W;
    const nx = (x - C)/R, ny = -(y - C)/R;
    let r2 = nx*nx + ny*ny;
    if (r2 > 1){ const s = 1/Math.sqrt(r2); }   // 允许边缘外点击（钳到边缘）
    const sx = r2 > 1 ? nx/Math.sqrt(r2) : nx;
    const sy = r2 > 1 ? ny/Math.sqrt(r2) : ny;
    const z = Math.sqrt(Math.max(0, 1 - sx*sx - sy*sy));
    const b = basis();
    const dir = b.s.clone().multiplyScalar(z)
      .addScaledVector(b.right, sx).addScaledVector(b.up, sy).normalize();
    State.observer.lat = Math.asin(clamp(dir.dot(b.up), -1, 1))/DEG;
    State.observer.lon = Math.atan2(dir.dot(b.right), Math.max(dir.dot(b.s), 1e-4))/DEG;
    AudioKit.pop();
    $('miniglobe-hint').textContent = '好，你现在就站在这里';
    notify('observer');
  });
  return { draw, show(){ panel.classList.remove('panel-hidden'); }, hide(){ panel.classList.add('panel-hidden'); } };
})();

function showModal({ emoji='', title='', html='', buttons=[], facts=[] }){
  const card = $('modal-card');
  card.innerHTML =
    (emoji ? `<span class="emoji">${emoji}</span>` : '') +
    (title ? `<h2>${title}</h2>` : '') +
    html +
    (facts.length ? `<div class="facts">${facts.map(f=>`<div class="fact">${f.t}<b>${f.v}</b></div>`).join('')}</div>` : '') +

  const box = $('cam-presets');
  box.innerHTML = '';
  for (const p of list){
    // pos/target 允许传函数：目标天体会移动的章节（如第5章地球公转）
    // 必须在「点击时」求值，否则会锁死在 setup 那一刻的位置。

    }});
  }
}

const readoutUpdaters = [];
function buildReadouts(rows){
  const box = $('readouts');
  box.innerHTML = '<div id="eclipse-type-badge">—</div>';
  readoutUpdaters.length = 0;
  const spans = {};
  for (const r of rows){

}
function updateReadouts(){
  for (const u of readoutUpdaters) u();
  const badge = $('eclipse-type-badge');
  if (badge) badge.textContent = eclipseTypeText();
}
function eclipseTypeText(){
  if (State.chapter === 4){
    return { none:'现在没有月食', penumbral:'👻 半影月食', partial:'🌗 月偏食', total:'🔴 月全食' }[D.lunType];

// ---- 共用：天体点击（序章名片卡） ----
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let clickHandlers = [];            // [{mesh, fn}]
function pickAt(clientX, clientY){
  pointer.set((clientX/window.innerWidth)*2-1, -(clientY/window.innerHeight)*2+1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickHandlers.map(h=>h.mesh), false);
  if (hits.length){
    const h = clickHandlers.find(x => x.mesh === hits[0].object);
    if (h) h.fn(hits[0]);
  }
  return hits.length > 0;
}
// 区分拖动与点击（OrbitControls 也在用 pointer）
let _downX = 0, _downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { _downX = e.clientX; _downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX-_downX, e.clientY-_downY) < 6) pickAt(e.clientX, e.clientY);
});

/* ═══════════════════════════════════════════════════════════════
   日–地–月统一轨道模型 —— 全作唯一摆放月球的地方
   ───────────────────────────────────────────────────────────────
   State.time ∈ [0,1] 就是一个完整的朔望月：
     0 / 1 = 朔（新月，月球在日地之间 → 可能日食）
     0.25  = 上弦        0.5 = 望（满月，月球在地影里 → 可能月食）
     0.75  = 下弦
   倾角 State.moonInclination 与升交点 State.nodeLongitude 同样在这里生效，
   所以"月亮的路是斜的，大多数时候影子错过"这件事在同一套几何里自然成立，
   不需要第5章另搞一套。
   ═══════════════════════════════════════════════════════════════ */
// 轨道上任意相位的单位方向（物理）。placeMoon 与轨道线共用，保证月亮永远落在自己的线上。
const _mdA = new THREE.Vector3(), _mdB = new THREE.Vector3();
function moonDirAtPhase(phase, out){
  const incl = State.moonInclination * DEG;
  const node = State.nodeLongitude * DEG;
  // 交点线：黄道面内，由升交点黄经决定（node=0 → 交点线沿日地连线，朔望皆成食）
  const nodeDir = _mdA.copy(sunDirW).applyAxisAngle(_YAXIS, node).normalize();
  // 轨道面内垂直于交点线的方向：黄道面内分量 cos(incl)，法向分量 sin(incl)
  const orbitPerp = _mdB.copy(_YAXIS).cross(nodeDir).normalize()
    .multiplyScalar(Math.cos(incl)).addScaledVector(_YAXIS, Math.sin(incl)).normalize();
  const u = phase - node;                              // 相对升交点的辐角
  return out.copy(nodeDir).multiplyScalar(Math.cos(u))
    .addScaledVector(orbitPerp, Math.sin(u)).normalize();
}
// 物理方向 → 渲染位置（黄道面内按距离缩放，黄纬按用途拆分，见 placeMoon 的注释）
function moonRenderPos(dirUnit, out){
  const dR = moonRenderDist(State.moonDistance);
  const DS = dR / State.moonDistance, RS = RE_RENDER / R_EARTH;
  const latOrbit = dirUnit.y * State.moonDistance * DS;
  const latTune  = MOON_LAT_CAP * Math.tanh(State.ch4Height * RS / MOON_LAT_CAP);
  return out.set(dirUnit.x*State.moonDistance*DS, latOrbit + latTune, dirUnit.z*State.moonDistance*DS);
}

function placeMoon(){
  const phase = State.time * Math.PI * 2;              // 0 = 朔
  const dir = moonDirAtPhase(phase, _v3);

  if (D.moonDirW) D.moonDirW.copy(dir); else D.moonDirW = dir.clone();
  D.moonPhase = phase;
  D.moonUpOff = State.ch4Height;                       // km，第4章"走高一点/低一点"微调

  // —— 物理位置（km，地心系）：这是唯一真相，derive() 也用它 ——
  const posKm = (D.moonPosKm || (D.moonPosKm = new THREE.Vector3()))
    .copy(dir).multiplyScalar(State.moonDistance);
  posKm.y += State.ch4Height;

  /* —— 物理 → 渲染 ——
     按「黄道面内 / 垂直黄道面」分解，而不是按日地轴分解：

       · 黄道面内(xz) 用距离缩放 —— 轨道因此是正圆，月亮绕一圈就是规规矩矩一圈。
       · 黄纬(y) 用「半径缩放」—— 决定影子打不打得中的正是它，
         必须和影锥半径可比；用距离缩放会被压扁 17 倍，于是月月成食。

     早先按日地轴分解是错的：上下弦时"偏离轴的距离"约等于整个月距，
     那跟成不成食毫无关系，却被一起放大，把圆轨道抻成了方的。
     tanh 只作用在黄纬上，大倾角时月亮不至于飞出画面。 */
  const dR = moonRenderDist(State.moonDistance);

  /* 黄道面内 → 距离缩放，轨道是正圆。
     黄纬拆成两块，各按各的用途缩放：

       · 倾角造成的黄纬 → 距离缩放。它决定的是「轨道长什么样」，
         必须保持 5.1° 该有的那点倾斜（约轨道半径的 9%）。
         放大它会把圆轨道拉成竖直椭圆，月亮上蹿下跳。

       · 第4章的高度微调 → 半径缩放。它决定的是「月亮从影子哪儿穿过去」，
         要和影锥半径比大小才拖得出擦边效果。

     两块都是 y 方向、都单调，叠加后轨迹平滑。
     倾角非零时渲染上月球会偏乐观地贴近影锥，但成食与否的判定、读数、
     天空亮度一律走物理量（derive 用的是 D.moonPosKm），不受影响。 */
  moonRenderPos(dir, _v1);
  moonMesh.position.copy(earthGroup.position).add(_v1);
  return dR;
}
// 兼容旧调用名：两章原本各有一套摆法，现在统一走 placeMoon()
const placeMoonForSolar = placeMoon;
function placeMoonForLunar(){
  return placeMoon();
}
function syncBodyUniforms(){
  updateSunDir();
  earthMat.uniforms.uEarthCenter.value.copy(earthGroup.position);
  earthMat.uniforms.uSunDirW.value.copy(sunDirW);
  earthMat.uniforms.uSunDistKm.value = State.sunDistance;
  earthMat.uniforms.uMoonDistKm.value = State.moonDistance;
  cloudMat.uniforms.uSunDirW.value.copy(sunDirW);
  atmoMat.uniforms.uSunDirW.value.copy(sunDirW);
  moonMat.uniforms.uSunDirW.value.copy(sunDirW);
  moonMat.uniforms.uMoonCenter.value.copy(moonMesh.position);
  moonMat.uniforms.uSunDistKm.value = State.sunDistance;
  moonMat.uniforms.uMoonDistKm.value = State.moonDistance;
  // 月心方向取自渲染位置（含第4章高度偏移）：地表影子与月面着色都跟随画面
  if (moonMesh.position.lengthSq() > 0.0001){
    moonMat.uniforms.uMoonDirW.value.copy(moonMesh.position).normalize();
    earthMat.uniforms.uMoonDirW.value.copy(moonMat.uniforms.uMoonDirW.value);
  }
}

    makeSlider(controlsBox, {

      value:State.moonInclination,

      sub:'真实值：5.1°',
      onChange:v => { State.moonInclination = v; State.ch5Flatten = false; this.flatToggle && this.flatToggle.set(false); },
    });
    this.flatToggle = makeToggle(controlsBox, {
      label:'🪄 把路拉平（0°）', value:false,
      onChange:v => { State.ch5Flatten = v;
        if (v) Narrator.say(['变成 0 度了……哇，每个月的影子都打中地球了！','现在明白为什么了吗？正因为月亮的路斜了那么一点点，影子大多数时候都扔到太空里去了。']);
      },
    });
    makeButton(controlsBox, { text:'🤔 猜猜一年能打中几次？', onClick:() => this.quiz() });
    Narrator.say([

    ], { perLine:(i, line) => {
      if (line.includes('按播放')){ State.playing = true; Timeline.refresh(); }
    }});
  },
  quiz(){
    showModal({
      emoji:'🤔', title:'猜猜看',
      html:'<p>一年里，月亮的影子能打中地球几次？</p>',
      buttons:[
        { text:'2 次', close:false, onClick:() => this.answer() },
        { text:'4 次左右', primary:true, close:false, onClick:() => this.answer() },
        { text:'12 次', close:false, onClick:() => this.answer() },
      ],
    });
  },
  answer(){
    this._quizDone = true;
    showModal({
      emoji:'🎁', title:'答案是：一年通常 4 次左右',
      html:`<p>最少 2 次，最多 5 次（你这一年看到了 <b style="color:var(--accent)">${this.hits}</b> 次）。</p>
            <p>但是别忘了——打中地球，不代表你能看到。你还得刚好站在那条很窄的线上才行。</p>`,
      buttons:[{ text:'我懂了', primary:true }],
    });
  },
  update(dt){
    // 倾角平滑动画（"把路拉平"瞬间对比）
    const target = State.ch5Flatten ? 0 : State.moonInclination;
    this._inclCur += (target - this._inclCur)*Math.min(1, dt*4);
    const incl = this._inclCur*DEG;
    const days = State.time*DAYS_PER_YEAR;
    const phiE = days/DAYS_PER_YEAR*Math.PI*2;
    // 地球在公转轨道上
    ch5EarthGroup.position.set(Math.cos(phiE)*EARTH_ORBIT_R5, 0, Math.sin(phiE)*EARTH_ORBIT_R5);
    // 相机跟着地球平移（否则地球绕太阳走一圈就飘出视野，只剩星空）。
    // 位置加增量以保留用户自己转过的视角，target 直接对准地球保证始终居中。
    if (this._camAnchor){
      if (!camTween.active && this._followEarth){
        const ep = ch5EarthGroup.position, a = this._camAnchor;
        camera.position.x += ep.x - a.x;
        camera.position.y += ep.y - a.y;
        camera.position.z += ep.z - a.z;
        controls.target.copy(ep);
      }
      this._camAnchor.copy(ch5EarthGroup.position);
    }
    // 交点退行（18.6 年一周）
    const node = State.nodeLongitude*DEG - days/(NODE_REGRESSION_YEARS*DAYS_PER_YEAR)*Math.PI*2;
    lunarPlanePivot.rotation.y = node;
    lunarPlane.rotation.x = -Math.PI/2 + incl;
    const nvec = new THREE.Vector3(Math.cos(node), 0, -Math.sin(node));
    const na = nodeLine.geometry.attributes.position.array;
    na[0]=-nvec.x*(MOON_ORBIT_R5+3.5); na[1]=0; na[2]=-nvec.z*(MOON_ORBIT_R5+3.5);
    na[3]= nvec.x*(MOON_ORBIT_R5+3.5); na[4]=0; na[5]= nvec.z*(MOON_ORBIT_R5+3.5);
    nodeLine.geometry.attributes.position.needsUpdate = true;
    // 月球位置：相位 β（相对日地线）+ 交点纬度 u
    const beta = days/SYNODIC_MONTH*Math.PI*2;
    const lambda = phiE + Math.PI + beta;               // 月球绝对黄经
    const u = lambda - node;
    const y = MOON_ORBIT_R5*Math.sin(u)*Math.sin(incl);
    ch5Moon.position.set(
      ch5EarthGroup.position.x + Math.cos(lambda)*MOON_ORBIT_R5,
      y,
      ch5EarthGroup.position.z + Math.sin(lambda)*MOON_ORBIT_R5);
    // 月球轨道线
    const oa = ch5MoonOrbit.geometry.attributes.position.array;
    for (let i=0;i<=128;i++){
      const ui = i/128*Math.PI*2, li = ui + node;
      oa[i*3]   = Math.cos(li)*MOON_ORBIT_R5;
      oa[i*3+1] = MOON_ORBIT_R5*Math.sin(ui)*Math.sin(incl);
      oa[i*3+2] = Math.sin(li)*MOON_ORBIT_R5;
    }
    ch5MoonOrbit.geometry.attributes.position.needsUpdate = true;
    // 月影射线（背向太阳）：太阳在 SUN_RENDER_POS，方向 = 月→日，射线指向背日侧
    const SUN5 = ch5Sun.position;
    const dirS = SUN5.clone().sub(ch5Moon.position).normalize();
    const ra = shadowRay.geometry.attributes.position.array;
    ra[0]=ch5Moon.position.x - dirS.x*0.8; ra[1]=ch5Moon.position.y - dirS.y*0.8; ra[2]=ch5Moon.position.z - dirS.z*0.8;
    ra[3]=ch5Moon.position.x - dirS.x*16;  ra[4]=ch5Moon.position.y - dirS.y*16;  ra[5]=ch5Moon.position.z - dirS.z*16;
    shadowRay.geometry.attributes.position.needsUpdate = true;
    // 新月/满月穿越检测 → 命中计数
    const frac = (days/SYNODIC_MONTH) % 1;
    if (frac < this._prevFrac - 0.5){                    // 新月（_frac 从 ~1 跳回 ~0）
      const yKm = D_MOON_MEAN*Math.sin((phiE+Math.PI)-node)*Math.sin(incl);
      if (Math.abs(yKm) < R_EARTH + 200){
        this.hits++;
        $('ch5-n').textContent = this.hits;
        hitFlash(); AudioKit.ding();
        if (!this._won && this._inclCur > 4){ this._won = true; awardBadge(4); }
      }
    }
    if (this._prevFrac < 0.5 && frac >= 0.5){             // 满月穿越
      const yKm = D_MOON_MEAN*Math.sin((phiE+Math.PI+Math.PI)-node)*Math.sin(incl);
      if (Math.abs(yKm) < D.rUmbraAtMoonKm + R_MOON){
        hitFlash();
      }
    }
    this._prevFrac = frac;
    updateScaleNote();
  },
  teardown(){ Timeline.hide(); },
};

const CHAPTERS = [ChPrologue, Ch1, Ch2, Ch3, Ch4, Ch5, ChSandbox];
// 各章时间轴长度（秒，1× 速度）
const TL_DUR = { 0:12, 3:26, 4:26, 5:16, 6:26 };   // 3/4/6 章一整圈 = 一个朔望月
const TL_LOOP = { 3:true, 4:true, 6:true };        // 月球公转：循环播放

// 时间轴上的月相标签（t ∈ [0,1] = 一个朔望月）
function phaseLabel(t){
  const d = t*SYNODIC_MONTH;
  const name = (t < 0.03 || t > 0.97) ? '新月（朔）' : t < 0.22 ? '娥眉月' : t < 0.28 ? '上弦月'
             : t < 0.47 ? '盈凸月' : t < 0.53 ? '满月（望）' : t < 0.72 ? '亏凸月'
             : t < 0.78 ? '下弦月' : '残月';
  return `第 ${d.toFixed(1)} 天 · ${name}`;
}

function goChapter(i){
  if (i === 6 && !State.badges[5]){
    showModal({ emoji:'🔒', title:'还没解锁哦',
      html:'<p>先把前面的六关都玩一遍，集齐五枚徽章，自由观测台就开门啦。</p>',
      buttons:[{ text:'好，继续闯关', primary:true }] });
    return;
  }
  const cur = CHAPTERS[State.chapter];
  if (cur && cur.teardown) cur.teardown();
  State.chapter = i;
  State.time = 0;
  State.playing = false;
  Timeline.refresh();
  refreshNav();
  const ch = CHAPTERS[i];
  chapterSplash(ch.num, ch.title, ch.goal);
  ch.setup();
}

/* ═══════════════════════════════════════════════════════════════
   ═══ 10. 主循环与启动 ═══
   每帧：时间轴推进 → 相机缓动 → 物理派生 → 章节更新 →
        主渲染（Bloom+暗角）→ 眼睛视图（最后画，盖在对应视口上）
   ═══════════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();
let booted = false;

function renderEyeFull(){
  // 第1章：眼睛视图铺满全屏
  eyeMat.uniforms.uAspect.value = window.innerWidth / window.innerHeight;   // 全屏按窗口宽高比校正
  eyeMat.uniforms.uPxPerRad.value = window.innerHeight / (2*eyeMat.uniforms.uFovHalf.value);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
  renderer.setScissorTest(true);
  renderer.clearDepth();
  renderer.render(eyeScene, eyeCam);
  renderer.setScissorTest(false);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 时间轴推进
  const dur = TL_DUR[State.chapter];
  if (State.playing && dur){
    State.time += dt*State.speed/dur;
    // 第3/4章与沙盒的时间轴是月球公转，应当一圈接一圈地转；
    // 第5章的"一年"到头就停（否则跨年会把命中计数重复累加）。
    if (State.time >= 1){
      if (TL_LOOP[State.chapter]) State.time -= 1;
      else { State.time = 1; State.playing = false; }
    }
    Timeline.refresh();
  }

  updateCamTween(dt);
  controls.update();
  updateSunDir();
  // 先让章节把天体摆到位，再算物理量 —— 否则 derive() 用的是上一帧的月球位置，
  // 拖滑杆时读数会比画面慢一帧。
  const chPre = CHAPTERS[State.chapter];
  if (chPre.preUpdate) chPre.preUpdate(dt);
  derive();

  // 共用 uniform
  sunMat.uniforms.uTime.value += dt;
  earthMat.uniforms.uTime.value += dt;
  cloudMat.uniforms.uTime.value += dt;

  // 章节逻辑（不直接渲染眼睛视图，只声明 D.eyeMode）
  const ch = CHAPTERS[State.chapter];
  if (ch.update) ch.update(dt);

  if (readoutUpdaters.length && !$('readouts').classList.contains('panel-hidden')) updateReadouts();

  // 主渲染
  composer.render();

  // 眼睛视图：永远与主视图同一物理状态，最后覆盖绘制
  if (D.eyeMode === 'full'){
    renderEyeFull();
  } else if (D.eyeMode >= 0){
    renderEyeView(D.eyeMode, dt);
  }
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ---- 启动 ----
function boot(){
  try {
    buildNav();
    onResize();
    // 自动跑一次科学自检（结果在控制台；也可随时 window.runSelfTest()）
    const st = runSelfTest();
    console.log('%c🌒 影子剧场已启动。科学自检：' + (st.all ? '全部通过 ✅' : st.pass + '/' + st.total + '（有未通过项，请检查）'),
      'color:#ffd166;font-weight:bold');
    window.SHADOW_STATE = State;   // 调试用
    window.SHADOW_D = D;
    window.SHADOW_SCENE = { scene, camera, controls, ch5Group, ch5EarthGroup, ch5Moon, ch5Sun, eclipticDisc, camTween, tweenCamera, eyeMat };
    // 支持 ?ch=3 直达某一章（家长直达 / 调试用）
    const qch = parseInt(new URLSearchParams(location.search).get('ch') ?? '', 10);
    if (qch === 6) State.badges = [true,true,true,true,true,true];   // 直达沙盒需解锁
    goChapter(Number.isFinite(qch) && qch >= 0 && qch <= 6 ? qch : 0);
    animate();
    booted = true;
    setTimeout(() => {
      const ld = $('loading');
      ld.classList.add('bye');
      setTimeout(() => ld.remove(), 900);
    }, 400);
  } catch(err){
    console.error(err);
    $('loading-err').textContent = '启动遇到问题：' + err.message + '（请确认网络能访问 unpkg.com 加载 three.js，或换 Chrome / Safari 打开）';
  }
}

// CDN 加载失败的兜底提示
window.addEventListener('error', e => {
  if (!booted && e.message){
    $('loading-err').textContent = '加载失败：' + e.message + '。这个文件需要从 unpkg.com 加载 three.js，请确认已联网，或用 Chrome / Safari 打开。';
  }
}, true);

boot();
</script>
